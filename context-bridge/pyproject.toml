[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "context-bridge"
version = "1.2.0"
description = "Carry a Glow plan to worker AIs and bring a scrubbed result back."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Context Bridge contributors" }]
keywords = ["llm", "handoff", "cli"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
cb = "context_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_bridge*"]
